name: Publish to NuGet

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version override (e.g. 1.0.0)'
        required: false
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore CSharpExtensions.slnx

    - name: Build solution (Release)
      run: dotnet build CSharpExtensions.slnx -c Release --no-restore

    - name: Run unit tests
      run: dotnet test CSharpExtensions.slnx -c Release --no-build --verbosity normal

    - name: Pack NuGet packages
      run: |
        if [ -n "${{ github.event.inputs.version }}" ]; then
          dotnet pack CSharpExtensions.slnx -c Release --no-build -p:PackageVersion=${{ github.event.inputs.version }} -p:Version=${{ github.event.inputs.version }}
        else
          dotnet pack CSharpExtensions.slnx -c Release --no-build
        fi

    - name: Authenticate with NuGet via OIDC (Trusted Publisher)
      uses: NuGet/login@v1
      with:
        owner: backend-crafter

    - name: Push packages to NuGet.org
      run: dotnet nuget push artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --skip-duplicate
